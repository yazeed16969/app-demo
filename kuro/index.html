<!doctype html><html lang='ar' dir='rtl'><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>KURO — نموذج تجريبي</title><style>body{margin:0;font-family:Arial;background:#f7f5f2;color:#171717}.app{max-width:720px;margin:auto}.head{background:#111;color:#fff;padding:24px}.note{font-size:12px;opacity:.72}.hero,.card{padding:20px}.hero{background:#eee}.card{margin:12px;background:#fff;border:1px solid #ddd;border-radius:16px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.nav{display:flex;gap:8px;padding:12px;flex-wrap:wrap}button{border:0;border-radius:12px;padding:10px 14px;background:#111;color:#fff;font-weight:bold}.bar{position:sticky;bottom:0;background:#111;color:#fff;padding:14px;display:flex;justify-content:space-between}</style><div class='app'><div class='head'><h1>KURO</h1><div class='note'>نموذج تجريبي غير رسمي — تصور مقترح للطلب والولاء</div></div><div class='hero'><h2>تجربة يابانية تبدأ من جوالك.</h2><p>تصور لتطبيق يجمع الماتشا، السوفليه بانكيك، الطلب المسبق، متابعة الطلب والمكافآت.</p></div><div class='nav'><button onclick="show('m')">المنيو</button><button onclick="show('o')">طلباتي</button><button onclick="show('p')">المكافآت</button></div><section id='m'><div class='card row'><b>Classic Matcha</b><button onclick="add('Classic Matcha',24)">+ 24 ر.س</button></div><div class='card row'><b>Strawberry Matcha</b><button onclick="add('Strawberry Matcha',28)">+ 28 ر.س</button></div><div class='card row'><b>Cloud Matcha</b><button onclick="add('Cloud Matcha',28)">+ 28 ر.س</button></div><div class='card row'><b>Soufflé Pancake</b><button onclick="add('Soufflé Pancake',36)">+ 36 ر.س</button></div></section><section id='o' hidden><div class='card' id='order'>لا توجد طلبات بعد.</div></section><section id='p' hidden><div class='card'><h3>KURO Rewards</h3><p>0 نقطة تجريبية</p></div></section><div class='bar'><span><b id='count'>0</b> عناصر • <b id='total'>0</b> ر.س</span><button onclick='checkout()'>طلب للاستلام</button></div></div><script>let c=[],t=0;function add(n,p){c.push(n);t+=p;count.textContent=c.length;total.textContent=t}function show(x){['m','o','p'].forEach(i=>document.getElementById(i).hidden=i!=x)}function checkout(){if(!c.length)return alert('أضف منتج أولاً');order.innerHTML='<b>طلب تجريبي #KU'+Math.floor(Math.random()*900+100)+'</b><p>الحالة: قيد التحضير</p>';c=[];t=0;count.textContent=0;total.textContent=0;show('o')}</script>
