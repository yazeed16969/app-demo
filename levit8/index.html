<!doctype html><html lang='ar' dir='rtl'><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>LEVIT8 — نموذج تجريبي</title><style>body{margin:0;font-family:Arial;background:#0d1117;color:#eee}.app{max-width:720px;margin:auto}.head{padding:24px;background:#111827}.note{font-size:12px;opacity:.7}.hero,.card{padding:20px}.hero{background:#161b22}.card{margin:12px;border:1px solid #30363d;border-radius:16px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}button{border:0;border-radius:12px;padding:10px 14px;font-weight:bold}.nav{display:flex;gap:8px;padding:12px;flex-wrap:wrap}.bar{position:sticky;bottom:0;background:#111827;padding:14px;display:flex;justify-content:space-between}</style><div class='app'><div class='head'><h1>LEVIT8</h1><div class='note'>نموذج تجريبي غير رسمي — تصور مقترح للطلب والولاء</div></div><div class='hero'><h2>قهوة وتقنية في تجربة واحدة.</h2><p>تصور لتطبيق يجمع المنيو، الطلب المسبق، الاستلام، متابعة الطلب والمكافآت.</p></div><div class='nav'><button onclick="show('m')">المنيو</button><button onclick="show('o')">طلباتي</button><button onclick="show('p')">النقاط</button></div><section id='m'><div class='card row'><b>Golden 8</b><button onclick="add('Golden 8',19)">+ 19 ر.س</button></div><div class='card row'><b>Spanish Latte</b><button onclick="add('Spanish Latte',19)">+ 19 ر.س</button></div><div class='card row'><b>V60</b><button onclick="add('V60',18)">+ 18 ر.س</button></div><div class='card row'><b>Honey Cake</b><button onclick="add('Honey Cake',20)">+ 20 ر.س</button></div></section><section id='o' hidden><div class='card' id='order'>لا توجد طلبات بعد.</div></section><section id='p' hidden><div class='card'><h3>LEVIT8 Rewards</h3><p>0 نقطة تجريبية</p></div></section><div class='bar'><span><b id='count'>0</b> عناصر • <b id='total'>0</b> ر.س</span><button onclick='checkout()'>طلب للاستلام</button></div></div><script>let c=[],t=0;function add(n,p){c.push(n);t+=p;count.textContent=c.length;total.textContent=t}function show(x){['m','o','p'].forEach(i=>document.getElementById(i).hidden=i!=x)}function checkout(){if(!c.length)return alert('أضف منتج أولاً');order.innerHTML='<b>طلب تجريبي #L8'+Math.floor(Math.random()*900+100)+'</b><p>الحالة: قيد التحضير</p>';c=[];t=0;count.textContent=0;total.textContent=0;show('o')}</script>
