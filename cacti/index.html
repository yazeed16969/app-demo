<!doctype html><html lang='ar' dir='rtl'><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Cacti Cafe — نموذج تجريبي</title><style>body{margin:0;font-family:Arial;background:#f2f4ee;color:#1f2a22}.app{max-width:720px;margin:auto;background:#fff;min-height:100vh}.head{background:#254b35;color:#fff;padding:24px}.note{font-size:12px;opacity:.75}.hero,.card{padding:20px}.hero{background:#e4ecdf}.card{margin:12px;border:1px solid #d9e2d6;border-radius:16px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.nav{display:flex;gap:8px;padding:12px;flex-wrap:wrap}button{border:0;border-radius:12px;padding:10px 14px;background:#254b35;color:#fff;font-weight:bold}.bar{position:sticky;bottom:0;background:#254b35;color:#fff;padding:14px;display:flex;justify-content:space-between}</style><div class='app'><div class='head'><h1>CACTI CAFE</h1><div class='note'>نموذج تجريبي غير رسمي — تصور لتجربة الطلب والولاء</div></div><div class='hero'><h2>مشروباتك المميزة، جاهزة وقت وصولك.</h2><p>تصور لتطبيق يجمع المشروبات، الطلب المسبق، متابعة الطلب والعروض ونقاط الولاء.</p></div><div class='nav'><button onclick="show('m')">المنيو</button><button onclick="show('o')">طلباتي</button><button onclick="show('p')">النقاط</button></div><section id='m'><div class='card row'><b>Signature Latte</b><button onclick="add('Signature Latte',21)">+ 21 ر.س</button></div><div class='card row'><b>Spanish Latte</b><button onclick="add('Spanish Latte',20)">+ 20 ر.س</button></div><div class='card row'><b>Cold Brew</b><button onclick="add('Cold Brew',20)">+ 20 ر.س</button></div><div class='card row'><b>Dessert Cup</b><button onclick="add('Dessert Cup',24)">+ 24 ر.س</button></div></section><section id='o' hidden><div class='card' id='order'>لا توجد طلبات بعد.</div></section><section id='p' hidden><div class='card'><h3>Cacti Rewards</h3><p>0 نقطة تجريبية</p></div></section><div class='bar'><span><b id='count'>0</b> عناصر • <b id='total'>0</b> ر.س</span><button onclick='checkout()'>طلب للاستلام</button></div></div><script>let c=[],t=0;function add(n,p){c.push(n);t+=p;count.textContent=c.length;total.textContent=t}function show(x){['m','o','p'].forEach(i=>document.getElementById(i).hidden=i!=x)}function checkout(){if(!c.length)return alert('أضف منتج أولاً');order.innerHTML='<b>طلب تجريبي #CA'+Math.floor(Math.random()*900+100)+'</b><p>الحالة: قيد التحضير ☕</p>';c=[];t=0;count.textContent=0;total.textContent=0;show('o')}</script>
