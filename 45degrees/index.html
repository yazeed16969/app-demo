<!doctype html><html lang='ar' dir='rtl'><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>45 Degrees — نموذج تجريبي</title><style>body{margin:0;font-family:Arial;background:#f6f2ea;color:#27231f}.app{max-width:720px;margin:auto;background:#fff;min-height:100vh}.head{background:#27231f;color:#fff;padding:24px}.note{font-size:12px;opacity:.75}.hero,.card{padding:20px}.hero{background:#eee5d8}.card{margin:12px;border:1px solid #ddd;border-radius:16px}.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.nav{display:flex;gap:8px;padding:12px;flex-wrap:wrap}button{border:0;border-radius:12px;padding:10px 14px;background:#27231f;color:#fff;font-weight:bold}.bar{position:sticky;bottom:0;background:#27231f;color:#fff;padding:14px;display:flex;justify-content:space-between}</style><div class='app'><div class='head'><h1>45 DEGREES</h1><div class='note'>نموذج تجريبي غير رسمي — تجربة رقمية مقترحة</div></div><div class='hero'><h2>زاويتك المثالية، جاهزة قبل وصولك.</h2><p>تصور لتصفح المنيو، اختيار الفرع، الطلب المسبق، متابعة الطلب ونقاط الولاء.</p></div><div class='nav'><button onclick="show('m')">المنيو</button><button onclick="show('o')">طلباتي</button><button onclick="show('p')">النقاط</button></div><section id='m'><div class='card row'><b>Espresso</b><button onclick="add('Espresso',12)">+ 12 ر.س</button></div><div class='card row'><b>Flat White</b><button onclick="add('Flat White',16)">+ 16 ر.س</button></div><div class='card row'><b>V60</b><button onclick="add('V60',18)">+ 18 ر.س</button></div><div class='card row'><b>Croissant</b><button onclick="add('Croissant',14)">+ 14 ر.س</button></div></section><section id='o' hidden><div class='card' id='order'>لا توجد طلبات بعد.</div></section><section id='p' hidden><div class='card'><h3>45 Rewards</h3><p>0 نقطة تجريبية</p></div></section><div class='bar'><span><b id='count'>0</b> عناصر • <b id='total'>0</b> ر.س</span><button onclick='checkout()'>إتمام الطلب</button></div></div><script>let c=[],t=0;function add(n,p){c.push(n);t+=p;count.textContent=c.length;total.textContent=t}function show(x){['m','o','p'].forEach(i=>document.getElementById(i).hidden=i!=x)}function checkout(){if(!c.length)return alert('أضف منتج أولاً');order.innerHTML='<b>طلب تجريبي #45'+Math.floor(Math.random()*900+100)+'</b><p>الحالة: جاري التحضير ☕</p>';c=[];t=0;count.textContent=0;total.textContent=0;show('o')}</script>
